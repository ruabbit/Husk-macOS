<!doctype html><meta charset="utf-8"><title>Java Web storage fixture</title>
<script>
const database = new Promise((resolve, reject) => {
    const request = indexedDB.open('husk-java-fixture', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('state');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
});
async function persist(value) {
    localStorage.setItem('value', value);
    const db = await database;
    await new Promise((resolve, reject) => {
        const tx = db.transaction('state', 'readwrite');
        tx.objectStore('state').put(value, 'value');
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
    return true;
}
async function readSave() {
    const db = await database;
    const indexed = await new Promise((resolve, reject) => {
        const request = db.transaction('state').objectStore('state').get('value');
        request.onsuccess = () => resolve(request.result ?? null);
        request.onerror = () => reject(request.error);
    });
    return {local: localStorage.getItem('value'), indexed, hidden: localStorage.getItem('pagehide')};
}
addEventListener('pagehide', () => {
    localStorage.setItem('pagehide', 'saved');
    localStorage.setItem('pagehideCount', String(Number(localStorage.getItem('pagehideCount') || 0) + 1));
});
addEventListener('unload', () => localStorage.setItem('unloadCount', String(Number(localStorage.getItem('unloadCount') || 0) + 1)));
window.fixturePageshowPersisted = false;
addEventListener('pageshow', e => window.fixturePageshowPersisted = e.persisted);
window.fixtureReady = true;
</script>
